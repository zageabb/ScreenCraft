name: ScreenCraft checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required standards
        run: |
          set -euo pipefail
          for f in README.md DEVELOPMENT.md DID.md AGENTS.md standards/SCRAFT_FILE_FORMAT_v1.md docs/ARCHITECTURE.md docs/INTERACTIVE_PROTOTYPE_PROPOSAL.md; do test -s "$f"; done
          grep -q 'Application-Standard' standards/SCRAFT_FILE_FORMAT_v1.md
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend
      - name: Test archive, API, SQL and export
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Type check and bundle
        working-directory: frontend
        run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install editor and Playwright
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build -f deploy/Dockerfile -t screencraft:ci .
      - name: Start API with migrated test database
        run: |
          docker run -d --name screencraft-ci --publish 127.0.0.1:8085:8085 \
            -e SCREENCRAFT_SECRET_KEY=ci-not-a-real-secret \
            -e SCREENCRAFT_SETUP_KEY=ci-setup-secret \
            -e DATABASE_URL=sqlite:////tmp/screencraft-ci.db \
            screencraft:ci
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8085/api/health | grep -q '"status":"ok"'; then exit 0; fi
            sleep 1
          done
          docker logs screencraft-ci
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f screencraft-ci || true
